# Physical Studio on one server: Caddy (HTTPS) -> viewer (app + Gemini tokens) and MCP server.
# Designs exported through the hosted MCP server land in the shared `designs` volume and show up
# at https://$DOMAIN/?design=out/<title>. Settings come from deploy/.env (see .env.example).
name: physical-studio

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      FRONT_HOSTS: ${FRONT_HOSTS:-front.invalid}  # see deploy/front.sh
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - viewer
      - mcp
      - studio

  viewer:
    build:
      context: ..
      dockerfile: deploy/viewer.Dockerfile
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-},${STUDIO_GEMINI_API_KEYS:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      GEMINI_CHECK_MODEL: ${GEMINI_CHECK_MODEL:-gemini-3.8-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_CHECK_MODEL: ${DEEPSEEK_CHECK_MODEL:-deepseek-flash}
      CHECKS_PER_MINUTE: ${CHECKS_PER_MINUTE:-30}
      DEMO_CODE: ${DEMO_CODE:-}
      TOKENS_PER_MINUTE: ${TOKENS_PER_MINUTE:-6}
    volumes:
      - designs:/data/out:ro

  mcp:
    build:
      context: ..
      dockerfile: deploy/mcp.Dockerfile
    restart: unless-stopped
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in deploy/.env}
      MCP_ALLOWED_HOSTS: ${DOMAIN}
      DESIGN_PROVIDERS: ${DESIGN_PROVIDERS:-openai,deepseek,gemini,anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DESIGN_MODEL: ${OPENAI_DESIGN_MODEL:-gpt-6.1-sol}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_DESIGN_MODEL: ${DEEPSEEK_DESIGN_MODEL:-deepseek-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-},${STUDIO_GEMINI_API_KEYS:-}
      GEMINI_DESIGN_MODEL: ${GEMINI_DESIGN_MODEL:-gemini-3.8-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DESIGN_MODEL: ${DESIGN_MODEL:-claude-opus-5-5}
      DESIGNS_PER_HOUR: ${DESIGNS_PER_HOUR:-4}
      DEMO_CODE: ${DEMO_CODE:-}
    volumes:
      - designs:/data/out

  studio:
    build:
      context: ..
      dockerfile: deploy/studio.Dockerfile
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-},${STUDIO_GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_STUDIO_MODEL:-gemini-3.8-flash}

volumes:
  designs:
  caddy_data:
  caddy_config:

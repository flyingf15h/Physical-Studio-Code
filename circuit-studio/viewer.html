<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#aaa6a3;color:#25364a;font:14px system-ui}#parts,#tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px}#parts{max-height:110px;overflow:auto}button{border:1px solid #aab5c3;border-radius:6px;background:#e7e5df;color:#25364a;padding:7px 10px;cursor:pointer}button.active{background:#26c6da;border-color:#147d8a}#info{padding:7px 12px;min-height:22px}#canvas{height:510px}#error{color:#a02020;padding:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="parts"></div><div id="tools"></div><div id="info">Drag to rotate · Scroll to zoom · Click a component or its name.</div><div id="canvas"></div><div id="error"></div><div id="startup" style="padding:8px 12px;color:#28313a;white-space:pre-wrap;overflow-wrap:anywhere">Loading model viewer…</div><script>
window.reportViewerError=function(e){const el=document.getElementById('error');el.textContent='Viewer error: '+(e&&e.message?e.message:String(e));document.getElementById('startup').textContent='Viewer could not start. Your generated GLB is still downloadable below.';};
window.addEventListener('error',function(e){if(e.message)window.reportViewerError(e.error||e.message);});window.addEventListener('unhandledrejection',function(e){window.reportViewerError(e.reason);});
</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const labels=__PART_DATA__,data='__MODEL_DATA__',host=document.querySelector('#canvas'),bar=document.querySelector('#parts'),tools=document.querySelector('#tools'),info=document.querySelector('#info');const meshes=[],buttons=new Map(),original=new Map();let flat=true,camera,controls,center,radius;
const highlightMaterial=new THREE.MeshBasicMaterial({color:'#26c6da',vertexColors:false,side:THREE.DoubleSide});
let selectedId=null;
function select(id){selectedId=id;for(const mesh of meshes){mesh.material=mesh.userData.part===id?highlightMaterial:mesh.userData.displayMaterial;}for(const[k,b]of buttons)b.classList.toggle('active',k===id);const p=labels.find(p=>p.id===id);info.textContent=p?'Selected: '+p.name+' ('+p.kind+') — cyan':'Drag to rotate · Scroll to zoom · Cyan always means selected.';}
function button(name,fn,target=tools){const b=document.createElement('button');b.textContent=name;b.onclick=fn;target.appendChild(b);return b;}
for(const p of labels){const b=button(p.name,()=>select(p.id),bar);buttons.set(p.id,b);}button('Clear highlight',()=>select(null));
function materials(){for(const mesh of meshes){const previous=mesh.userData.displayMaterial;const created=mesh.userData.source.map(old=>{const options={color:old.color?.clone()||new THREE.Color('white'),vertexColors:!!mesh.geometry.attributes.color,side:THREE.DoubleSide};return flat?new THREE.MeshBasicMaterial(options):new THREE.MeshStandardMaterial({...options,roughness:.85,metalness:0});});mesh.userData.displayMaterial=created.length===1?created[0]:created;if(previous)for(const m of(Array.isArray(previous)?previous:[previous]))m.dispose();}select(selectedId);}
const lightButton=button('Lighting: evenly lit',()=>{flat=!flat;materials();lightButton.textContent=flat?'Lighting: evenly lit':'Lighting: soft studio';select(null);});
function reset(top=false){if(!camera||!center)return;controls.target.copy(center);camera.up.set(0,1,0);camera.position.copy(center).add(top?new THREE.Vector3(0,radius*1.9,.0001):new THREE.Vector3(radius*.65,radius*.95,radius*1.2));controls.update();}button('Reset view',()=>reset());button('Top view',()=>reset(true));
try{const scene=new THREE.Scene();scene.background=new THREE.Color('#aaa6a3');camera=new THREE.PerspectiveCamera(42,1,.0001,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=false;host.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,2));scene.add(new THREE.HemisphereLight(0xffffff,0xd1d7de,2));for(const pos of[[2,4,3],[-3,2,-2],[0,-3,0]]){const light=new THREE.DirectionalLight(0xffffff,1.8);light.position.set(...pos);scene.add(light);}controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0)),gltf=await new GLTFLoader().parseAsync(bytes.buffer,'');scene.add(gltf.scene);gltf.scene.traverse(obj=>{if(!obj.isMesh)return;let current=obj;while(current){const p=labels.find(p=>current.name.startsWith(p.id+'__'));if(p){obj.userData.part=p.id;break;}current=current.parent;}obj.userData.source=Array.isArray(obj.material)?obj.material:[obj.material];meshes.push(obj);});materials();document.getElementById('startup').textContent='Model loaded. Select a part above.';const bounds=new THREE.Box3().setFromObject(gltf.scene);center=bounds.getCenter(new THREE.Vector3());const size=bounds.getSize(new THREE.Vector3());radius=Math.max(size.x,size.y,size.z,.01);camera.near=Math.max(radius/1500,.00001);camera.far=Math.max(radius*100,10);camera.updateProjectionMatrix();reset();
let down;const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(meshes,false).find(h=>h.object.userData.part);select(hit?.object.userData.part||null);});function resize(){camera.aspect=host.clientWidth/510;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,510);}new ResizeObserver(resize).observe(host);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});}catch(e){window.reportViewerError(e);}
</script></body></html>
